openapi: 3.0.3
info:
  title: PayTest Backend API
  description: |
    Sistema de simulación de pagos para capacitación en Testing con Agentes e Herramientas de IA.
    
    ## Autenticación
    Todos los endpoints protegidos requieren el header `Authorization: Bearer <token>`.
  version: 1.0.0
  contact:
    name: PayTest Team
servers:
  - url: http://localhost:8080/api
    description: Servidor de desarrollo

tags:
  - name: Auth
    description: Autenticación y registro
  - name: Account
    description: Gestión de cuentas
  - name: Transactions
    description: Transacciones y transferencias
  - name: Contacts
    description: Gestión de contactos
  - name: Sessions
    description: Sesiones de usuario

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar nuevo usuario
      description: Registra un nuevo usuario con cuenta y saldo inicial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Código de sala inválido o ya usado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Autentica usuario y retorna token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sala/{code}:
    get:
      tags:
        - Auth
      summary: Validar código de sala
      description: Verifica si un código de sala es válido y no ha sido usado
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultado de validación
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean

  /accounts/balance:
    get:
      tags:
        - Account
      summary: Obtener balance
      description: Retorna el balance actual de la cuenta del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance recuperado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user_unique_id:
                        type: string
                      balance:
                        type: number
                        format: float
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cuenta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/send:
    post:
      tags:
        - Transactions
      summary: Enviar dinero
      description: Transfiere dinero a otro usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMoneyRequest'
      responses:
        '200':
          description: Transferencia exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: '#/components/schemas/Transaction'
                      new_balance:
                        type: number
                        format: float
        '400':
          description: Fondos insuficientes o validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario destinatario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/history:
    get:
      tags:
        - Transactions
      summary: Historial de transacciones
      description: Obtiene el historial de transacciones del usuario
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Historial recuperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      count:
                        type: integer

  /contacts/add:
    post:
      tags:
        - Contacts
      summary: Agregar contacto
      description: Agrega un usuario a la lista de contactos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContactRequest'
      responses:
        '200':
          description: Contacto agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      contact:
                        $ref: '#/components/schemas/ContactInfo'
        '404':
          description: Usuario a agregar no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Contacto ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/list:
    get:
      tags:
        - Contacts
      summary: Listar contactos
      description: Obtiene la lista de contactos del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contactos recuperados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContactInfo'
                      count:
                        type: integer

  /sessions/info:
    get:
      tags:
        - Sessions
      summary: Info de sesión
      description: Obtiene información de la sesión actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Información de sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user_unique_id:
                        type: string
                      ip_address:
                        type: string
                        nullable: true
                      user_agent:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time

  /sessions/logout:
    post:
      tags:
        - Sessions
      summary: Cerrar sesión
      description: Invalida el token de sesión actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - password
        - room_code
      properties:
        name:
          type: string
          minLength: 2
          example: Juan Pérez
        password:
          type: string
          minLength: 6
          example: "secret123"
        room_code:
          type: string
          example: "TRAINING01"

    LoginRequest:
      type: object
      required:
        - userId
        - password
      properties:
        userId:
          type: string
          example: "TFJOTJQEL4P3"
        password:
          type: string
          example: "secret123"

    SendMoneyRequest:
      type: object
      required:
        - to_user_unique_id
        - amount
        - idempotency_key
      properties:
        to_user_unique_id:
          type: string
          description: ID único del usuario destinatario
          example: "A8LSIWVLGZ1Q"
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 100.00
        idempotency_key:
          type: string
          description: Key única para evitar duplicaciones
          example: "tx_abc123def456"

    AddContactRequest:
      type: object
      required:
        - contact_user_unique_id
      properties:
        contact_user_unique_id:
          type: string
          description: ID único del usuario a agregar como contacto
          example: "A8LSIWVLGZ1Q"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            token_type:
              type: string
              example: "Bearer"
            expires_in:
              type: integer
              example: 3600
            user:
              type: object
              properties:
                unique_id:
                  type: string
                name:
                  type: string

    Transaction:
      type: object
      properties:
        id:
          type: integer
        idempotency_key:
          type: string
        account_user_unique_id:
          type: string
        counterpart_user_unique_id:
          type: string
          nullable: true
        type:
          type: string
          enum: [INCOME, SPEND, REQUEST]
        amount:
          type: number
          format: float
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ContactInfo:
      type: object
      properties:
        contact_user_unique_id:
          type: string
        contact_name:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
